[package]
name = "ndi-spike"
version = "0.0.0"
edition = "2021"
publish = false

# Throwaway N0 spike (native-output-dev.md §7). Proves Rust → NDI runtime →
# receiver on this machine, standalone from DiscoCast. Not part of the app build.

[[bin]]
name = "ndi-spike"
path = "src/main.rs"

[dependencies]
# JPEG only — the sidecar decodes frames the app sends as JPEG over stdin.
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
