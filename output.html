<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Output — DiscoCast Visualizer</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #out-stage { position: relative; width: 100vw; height: 100vh; background: #000; isolation: isolate; }
    /* Every routed track is a full-frame layer — stacking is overlay, composited
       by zIndex/opacity/blend (region is an operator-screen concern, not output). */
    #out-stage .out-layer { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; background: transparent; }
    .chrome {
      position: fixed; top: 14px; left: 14px; z-index: 2;
      display: flex; gap: 10px; align-items: center;
      transition: opacity .4s ease;
    }
    body.idle .chrome { opacity: 0; pointer-events: none; }
    body.idle { cursor: none; }
    #out-fs {
      background: rgba(20,20,24,.7); color: #fff;
      border: 1px solid rgba(255,255,255,.18); border-radius: 7px;
      padding: 7px 12px; font: 13px system-ui; cursor: pointer;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    #out-fs:hover { background: rgba(40,40,48,.85); }
    #out-status { color: rgba(255,255,255,.6); font-size: 12px; }
  </style>
</head>
<body>
  <div id="out-stage"></div>
  <div class="chrome">
    <button id="out-fs" type="button">⛶ Fullscreen</button>
    <span id="out-status">Connecting…</span>
  </div>
  <script type="module" src="/src/output/outputWindow.js"></script>
</body>
</html>
