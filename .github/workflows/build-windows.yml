name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    # actions/upload-artifact@v5 still ships a Node 20 runtime; this forces it (and any
    # other lingering Node 20 action) onto Node 24, clearing the deprecation warning.
    # GitHub's documented opt-in — see the deprecation notice. Remove once all actions are Node 24.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      # ⚠️ LOAD-BEARING: tauri.conf.json has `beforeBuildCommand: ""` (disabled), so the
      # "Build Windows app" step below does NOT build the frontend — it bundles the dist/
      # this step produces. Do NOT remove this step, or the installer ships a stale/missing
      # frontend. (beforeBuildCommand was disabled 2026-06-08 to stop a redundant 2nd vite
      # run that intermittently wedged the macOS build.)
      - name: Build Vite web app
        run: npm run build

      - name: Generate Windows icon (.ico)
        run: magick "src-tauri/icons/128x128.png" -define icon:auto-resize=256,128,64,48,32,16 "src-tauri/icons/icon.ico"

      - name: Build Windows app
        run: npx tauri build --bundles msi,nsis

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: DiscoCast-Visualizer-Windows-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
