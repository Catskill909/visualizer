[package]
name = "discocast-visualizer"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-save", "dialog-open", "window-set-fullscreen", "shell-execute", "shell-sidecar", "protocol-asset"] }
base64 = "0.21"
serde = { version = "1", features = ["derive"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "macos")'.dependencies]
# keep_rendering_when_covered / disable_app_nap (main.rs)
objc = "0.2"

[lints.rust]
# objc 0.2's macros test cfg(feature = "cargo-clippy"); declare it so rustc doesn't warn.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
