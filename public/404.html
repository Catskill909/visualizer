<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — DiscoCast</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0a0a0f; --panel: #14141c; --line: #2a2a36;
      --text: #ecedf3; --muted: #8d8da0; --btn: #ededf2; --btn-text: #0e0e13;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #15151f, var(--bg));
      color: var(--text); font: 16px/1.6 -apple-system, system-ui, "Segoe UI", sans-serif;
      display: grid; place-items: center; padding: 24px; text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 440px; }
    img.logo { width: 56px; height: 56px; margin-bottom: 22px; opacity: .95; }
    .code { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    h1 { font-size: 30px; margin: 0 0 12px; font-weight: 700; }
    p { color: var(--muted); margin: 0 0 28px; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600;
      color: var(--btn-text); background: var(--btn);
      padding: 13px 22px; border-radius: 12px; transition: background .15s;
    }
    a.btn:hover { background: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="DiscoCast">
    <div class="code">404 · Page not found</div>
    <h1>This page doesn’t exist</h1>
    <p>The link may be wrong or the page has moved.</p>
    <a class="btn" href="/">Back to DiscoCast</a>
  </div>
</body>
</html>
